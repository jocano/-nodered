services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    devices:
      - /dev/serial/by-id/usb-SMLIGHT_SMLIGHT_SLZB-07p7_30774bf4c48aef11873720ccef8776e9-if00-port0:/dev/ttyUSB0
    environment:
      - TZ=America/New_York

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: America/New_York
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY}
    volumes:
      - ../node-red/data:/data

